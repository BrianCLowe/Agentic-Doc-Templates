# Optional team inbox routing — omit this entire key = human-only inbox (legacy).
# Do not copy this block into live ADT-settings.yaml "to have something."
# Unset / missing / enabled: false = today's behavior: everything waits on the
# human. No auto-stamp. Not a mandatory multi-bot org chart. Do not force a project into
# Brian's (or any other team's) workflow — each user/team works out who gets what.
# Role ids are free-form strings the project defines, or "human".
# Never paste secrets or bot credentials here.
#
# Enabling team_inbox opts into assign-all-at-once:
#   1. Stamp-on-dual-write — new Open rows get Assignee from kind_defaults in
#      the same edit only when that role_id is Active on Team-Roster.md
#      (e.g. playtest → qa after QA self-IDed). Else unassigned. No claim
#      PR / no per-row human click for the first fill. Do not invent a
#      roster row to make the stamp work.
#   2. One-shot backfill — after enable + kind_defaults, and after a
#      matching role_id is Active on docs/Team-Roster.md, run
#      “apply defaults to Open” once: fill unassigned Open rows from
#      kind_defaults. Do not re-stamp rows that already have an explicit
#      assignee (claimed / reassigned).
#   Team roster (docs/Team-Roster.md) is who exists (Name) + Jobs +
#   Anti-jobs (if defined) + handoff. Create the live file only when
#   team_inbox is enabled (empty Active except human fill-in). Two-stage:
#   coding agents on a handoff READ only — do not invent bot rows. Bots
#   SELF-ID their own row. Report-only bots ask another agent or the
#   human to add them. Full-team stand-up = one scribe / one initial PR
#   (do not open competing Team-Roster PRs). Update the row when Name /
#   Jobs / Anti-jobs change. Do not invent anti-jobs. Do not backfill
#   Active from kind_defaults or from this example.
#   3. Claim / reassign is override only (human or allowed bot) — not the
#      bulk path.
#   4. Bot discovery — bots watch “my open rows” / one digest ping. Not one
#      PR per claim.
# kind_defaults are the stamp map when enabled — still project-owned, not a
# pack-required org chart.
#
# Example stamp map some teams use (not pack-required defaults):
#   playtest → qa; placement / YTF feel notes → ux (if they have one);
#   procure / decide / secrets → human;
#   code implement → implementer (usually feature *-TODO.md, not Human-TODO);
#   Understanding drain → understanding-author;
#   nightly audit → report-only unless green-lit.
#
# team_inbox:
#   enabled: false   # set true only when this project uses bot assignees (opts into stamp-on-dual-write)
#   # source: user
#   recorded: YYYY-MM-DD
#   # Stamp map by Human-TODO kind — project overrides freely.
#   kind_defaults:
#     playtest: qa
#     decide: human
#     procure: human
#     waiting: human
#   # claim_mode: open | kind_defaults_only
#   #   open = any listed role may claim kinds in its may_claim; human always may assign/claim
#   #   kind_defaults_only = stamp + override only via explicit claim/reassign
#   # assignee_closes: false   # default: bot reports; human or assignee confirms. true = assignee confirm report may close that kind
#   # roles: free-form map role_id → { label, may_claim: [kinds...], may_assign: true|false }
#   #   qa:
#   #     label: QA
#   #     may_claim: [playtest]
#   #     may_assign: false
#   #   ux:
#   #     label: UX
#   #     may_claim: [playtest]
#   #     may_assign: false

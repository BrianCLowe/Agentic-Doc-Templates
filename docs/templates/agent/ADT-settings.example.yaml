# Example — copy to docs/ADT-settings.yaml when recording the first pack preference.
# Live file: docs/ADT-settings.yaml (project-specific; survives pack overwrite on TEMPLATE_SYNC)
#
# Replaces older docs/rule-install-status.yaml + docs/upstream-status.yaml (migrate on sync).

version: 1

# Pack sync behavior — bootstrap / first sync asks once; do not re-ask every update.
# auto     = apply all changelog-gated live work + refresh installed rules (no mid-sync optionals quiz)
#            + local post-sync hygiene commits (pack/stamps, then reshape, then TODO ambition when those ran)
#            Still asks once for brand-new unset optional_rules.* (doc-roles, update-check, …)
#            Pre-sync dirty tree is still a hard stop (commit YOUR work first) — see TEMPLATE_SYNC_A A0
# auto-all = same as auto, and also enable + install any unset optional_rules.* (never re-enable declined)
#            New update-check defaults to check_mode: always (no cadence quiz)
# choose   = present optionals (reshape, TODO ambition, …) each sync; suggest commits, ask before committing
sync:
  mode: auto
  recorded: 2026-08-06

# Docs ceremony profile — first-class choice, not a concession.
# prevent    = editors / games / multi-surface / identity-risky. Understanding + shape confirm.
#              Unset → prevent (do not silent-downgrade those repos).
# ship-first = typed APIs / CRUD / clear contracts. Spec + TODO only. The right default there.
# balanced   = Understanding only when identity is ambiguous / multi-surface / split / user asked.
# Bootstrap / first “build from reference” may suggest a mode from docs/reference/ (cite 2–3
# snippets) then ask once. Re-ask only on explicit *Set docs profile to …* / *Change docs ceremony*.
docs_profile:
  mode: prevent
  recorded: 2026-08-08
  # source: user | agent-suggested

# Orchestrator git delivery — how unattended backlog runs land in git.
# milestone-pr     = recommend when remote + forge — each milestone (several related TODOs OK; concurrent implementers when they do not overlap): branch → PR → squash → ready → wait CI/Bugbot → merge → next branch
# local            = milestone commits only; no push / PR
# branch-pr-squash = one run branch → milestone commits → push → draft PR mid-run → end: build-verify → squash whole run → mark ready (no merge)
# branch-pr        = same without squash (keeps milestone history on the PR; no merge)
# branch-push      = same without PR (remote but no gh/glab, or no PR culture)
# current-push     = milestone commits on the branch you are already on → push (solo opt-in; often main). Never silent-default
# none             = no commits
# milestone-pr cycle: per milestone — final push → build verify → warden → squash whole milestone → mark ready → wait CI/Bugbot → merge → default → next branch
# branch-pr / branch-pr-squash close-out: final push → build verify → squash(if squash mode) → mark ready (no merge)
# Unset → always ask (bootstrap Step 3p / sync B0.6 / orchestrator pre-run) — even under sync.mode auto-all; never invent current-push
# Cloud Agent path: if a remote Cloud Agent orchestrates while this key is local/none/branch-push/current-push/branch-pr/branch-pr-squash,
#   it uses milestone-pr for that run only (does not rewrite this file) — see agent/roles/orchestrator-git.md
# After choose/change: forge tooling probe — see agent/roles/orchestrator-git.md
# Re-ask only on *Set orchestrator git to …* / change this key.
# Reviewers / Bugbot: a mode change in this file with source: user is an explicit
#   user ask (same PR is fine) — not a forbidden pack migrate. Do not fail or revert it.
# Sync must not rewrite a set mode just because the pack recommend flipped.
# Cloud Agent this-run uses milestone-pr without writing this file.
# Worktrees are not a key (do not add orchestrator.git.worktrees). Host isolation
# for concurrent implementers lives in agent/roles/orchestrator-git.md + tools/<host>.md.
orchestrator:
  git:
    mode: milestone-pr
    recorded: 2026-08-12
    # source: user | agent-suggested

# standing: — omit this entire key unless the user has actually overridden an
# ADT playbook and no first-class key fits (docs_profile, orchestrator.git.mode,
# sync.mode, optionals). Missing / empty is the correct default. Do not invent
# bullets. Do not copy an empty standing block into live ADT-settings.yaml
# "to have something." Not a notes pad — prompt style, other-product API,
# Tooling verify commands, and restating a git mode do not belong here
# (use the key / Tooling.md / spec Decisions). TEMPLATE_SYNC never overwrites
# a live standing block if one exists.
# LOOKOUT (Workflow §0.2): create standing.instructions only in that override
# case, then say you saved it. This-turn user instructions always win.
# Hard pack safety still wins (dirty-tree hard stop, no silent current-push,
# no force-push / protected-main surprises).


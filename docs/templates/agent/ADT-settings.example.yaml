# Upstream ping stamps — used when optional_rules.template-update-check is enabled.
# Survives pack overwrite (this whole file lives under docs/, not docs/templates/).
#
# check_mode:
#   always   — default / recommended: fetch upstream VERSION each session when the rule runs
#   interval — only fetch when last_checked is older than check_interval_days

upstream:

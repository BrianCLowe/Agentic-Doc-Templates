# Upstream ping stamps — used when optional_rules.template-update-check is enabled.
# Survives pack overwrite (this whole file lives under docs/, not docs/templates/).
#
# check_mode:
#   always   — default / recommended: fetch upstream VERSION each session. Do not
#              write last_checked, update_available, or upstream_pack_version.
#   interval — fetch when last_checked is older than check_interval_days, then
#              set last_checked; set or clear update_available /
#              upstream_pack_version as appropriate.

upstream:
  check_mode: always
  check_mode_recorded: 2026-08-07   # set when the user chooses cadence (bootstrap / sync B0.4) — missing → ask once
  # local_pack_version is set on enable / TEMPLATE_SYNC from docs/templates/VERSION.
  # Do not copy a number from this example. Do not set it on a session check.
  # local_pack_version: "X.Y.Z"
  #
  # always (no interval): do not write last_checked, update_available, or
  # upstream_pack_version. The rule fetches again next session.
  #
  # interval only:
  # check_mode: interval
  # check_interval_days: 7
  # last_checked: 2026-07-16
  # upstream_pack_version: "X.Y.Z"
  # update_available: true

# Optional team inbox routing — omit this entire key = human-only inbox (legacy).
# Do not copy this block into live ADT-settings.yaml "to have something."
# Unset / missing / enabled: false = today's behavior: everything waits on the
# human. No auto-stamp. Not a mandatory multi-bot org chart. Do not force a project into
# Brian's (or any other team's) workflow — each user/team works out who gets what.
# Role ids are free-form strings the project defines — named-human slugs
# (alex) or bot ids (qa). Leftover "human" is a catch-all bucket, not a person.
# Never paste secrets or bot credentials here.
#
# Enabling team_inbox opts into assign-all-at-once:
#   1. Stamp-on-dual-write — new Open rows get Assignee from kind_defaults in
#      the same edit only when that role_id is Active on Team-Roster.md
#      (e.g. playtest → qa after QA self-IDed). Else unassigned. No claim
#      PR / no per-row human click for the first fill. Do not invent a
#      roster row to make the stamp work.
#   2. One-shot backfill — after enable + kind_defaults, run
#      “apply defaults to Open” once: fill unassigned Open rows from
#      kind_defaults only if that role_id is Active on Team-Roster.md.
#      Else leave unassigned. Do not re-stamp rows that already have
#      an explicit assignee (claimed / reassigned). Do not stamp an
#      id that is not Active — that locks the row against a later
#      self-ID.
#   Team roster (docs/Team-Roster.md) is who exists (Name) + Jobs +
#   Anti-jobs (if defined) + handoff — named humans and bots. Create
#   the live file only when team_inbox is enabled (empty Active until
#   someone self-IDs). Two-stage: coding agents on a handoff READ only
#   — do not invent bot rows or human names. Named humans and bots
#   SELF-ID their own row (humans use their slug, not leftover human).
#   Report-only bots ask another agent or the human to add them.
#   Full-team stand-up = one scribe / one initial PR (do not open
#   competing Team-Roster PRs). Update the row when Name / Jobs /
#   Anti-jobs change. Do not invent anti-jobs. Do not backfill Active
#   from kind_defaults or from this example.
#   3. Claim / reassign is override only (human or allowed bot) — not the
#      bulk path.
#   4. Bot discovery — bots watch “my open rows” / one digest ping. Not one
#      PR per claim.
# kind_defaults are the stamp map when enabled — still project-owned, not a
# pack-required org chart.
#
# Example stamp map some teams use (not pack-required defaults):
#   playtest → qa; placement / YTF feel notes → ux (if they have one);
#   procure / decide / secrets → a named human slug if they self-IDed,
#   or leftover human if that row is Active, or leave unassigned;
#   Understanding drain → understanding-author;
#   nightly audit → report-only unless green-lit.
#
# team_inbox:
#   enabled: false   # set true only when this project uses bot assignees (opts into stamp-on-dual-write)
#   # source: user
#   recorded: YYYY-MM-DD
#   # Stamp map by Human-TODO kind — project overrides freely.
#   kind_defaults:
#     playtest: qa
#     decide: alex          # named-human slug if Active; leftover human otherwise
#     procure: alex
#     waiting: human        # leftover bucket only if that id is Active
#   # claim_mode: open | kind_defaults_only
#   #   open = any listed role may claim kinds in its may_claim; human always may assign/claim
#   #   kind_defaults_only = stamp + override only via explicit claim/reassign
#   # assignee_closes: false   # default: bot reports; human or assignee confirms. true = assignee confirm report may close that kind
#   # roles: free-form map role_id → { label, may_claim: [kinds...], may_assign: true|false }
#   #   qa:
#   #     label: QA
#   #     may_claim: [playtest]
#   #     may_assign: false
#   #   ux:
#   #     label: UX
#   #     may_claim: [playtest]
#   #     may_assign: false
